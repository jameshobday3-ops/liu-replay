name: Export python-flint cp313 wheel

on:
  push:
    branches: [rh-window15-enrichment-audit]
    paths:
      - '.github/workflows/export-flint-cp313.yml'

permissions:
  contents: read

jobs:
  export-wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact binary wheels
        run: |
          set -euo pipefail
          mkdir wheelhouse
          python -m pip download --only-binary=:all: --no-deps python-flint==0.8.0 -d wheelhouse
          python -m pip download --only-binary=:all: --no-deps mpmath==1.3.0 -d wheelhouse
          sha256sum wheelhouse/* > wheelhouse/SHA256SUMS.txt
          ls -lh wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: python-flint-0.8.0-cp313-wheel
          path: wheelhouse/
          retention-days: 7
