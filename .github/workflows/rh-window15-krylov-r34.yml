name: RH Window15 Adaptive Krylov Rank 3-4

on:
  push:
    branches:
      - rh-window15-krylov
    paths:
      - '.github/workflows/rh-window15-krylov-r34.yml'

permissions:
  contents: read
  actions: read

jobs:
  adaptive-krylov:
    strategy:
      fail-fast: false
      matrix:
        parity: [even, odd]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PARITY: ${{ matrix.parity }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned arithmetic stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install python-flint==0.8.0 mpmath==1.3.0 numpy==2.3.5 scipy==1.17.0

      - name: Download frozen Window15 source packet
        uses: actions/download-artifact@v4
        with:
          name: window15-source-packet
          path: sourcepkt
          repository: ${{ github.repository }}
          run-id: 41896525565
          github-token: ${{ github.token }}

      - name: Download prior two-residual audit evidence
        uses: actions/download-artifact@v4
        with:
          name: window15-enrichment-audit
          path: auditpkt
          repository: ${{ github.repository }}
          run-id: 41445033122
          github-token: ${{ github.token }}

      - name: Prepare parity workspace
        run: |
          set -euo pipefail
          mkdir -p work
          if [ "$PARITY" = "even" ]; then P=0; else P=1; fi
          echo "P=$P" >> "$GITHUB_ENV"
          cp "auditpkt/p${P}_second_residual_polynomial_proposal.json" work/seed2.json
          cp "auditpkt/second_moment3_column_p${P}.json" work/c3_2.json
          cp "auditpkt/second_cross_scalars_p${P}.json" work/second_cross.json
          test -f sourcepkt/spectral/A${P}.jsonl.gz
          test -f sourcepkt/spectral/B${P}.jsonl.gz
          test -f sourcepkt/spectral/K${P}.jsonl.gz

      - name: Reproduce zero-shift seed 1
        working-directory: sourcepkt/spectral
        run: |
          set -euo pipefail
          python certify_spectrum.py --parity "$PARITY" --thresholds 0 --precision 1024
          cp "p${P}_s0_residual_polynomial_proposal.json" ../../work/seed1.json

      - name: Rebuild certified C3 column for seed 1
        working-directory: work
        run: |
          set -euo pipefail
          python ../rh-window15-krylov/build_increment_moments.py \
            --parity "$PARITY" \
            --seed seed1.json \
            --c3-out c3_1.json \
            --stage c3 \
            --precision 8192

      - name: Regression-check seed-1 C3 against 31 October archive
        working-directory: work
        run: |
          python - <<'PY'
          import json,hashlib,os
          p=int(os.environ["P"])
          expected={
            0:"2c92977dcdd0cfac01a7a661b8cf4d4d1577e29375fefe7350ae184fd22b81e6",
            1:"aea3e1c208c8b6a9d00523b6056b2310bbd2de07cccc1c83e4e9bd4f5f65a1e6",
          }[p]
          d=json.load(open("c3_1.json"))
          h=hashlib.sha256(json.dumps(d["rows"],separators=(",",":")).encode()).hexdigest()
          print("C3 rows hash",h)
          if h!=expected:
              raise SystemExit(f"C3 regression mismatch: {h} != {expected}")
          print("PASS_ARCHIVED_C3_ROW_HASH")
          PY

      - name: Initialize certified rank-2 C4 Gram
        working-directory: work
        run: |
          python - <<'PY'
          import json
          d=json.load(open("second_cross.json"))
          q=dict(zip(d["quantities"],d["rows"]))
          out={
            "status":"INITIALIZED_FROM_CERTIFIED_SECOND_CROSS_SCALARS",
            "bits":d["bits"],
            "dimension":2,
            "rows":[[q["C4_11"],q["C4_12"]],[q["C4_12"],q["C4_22"]]],
            "source":"second_cross_scalars from clean 2 November Arb audit"
          }
          open("c4_r2.json","w").write(json.dumps(out,separators=(",",":"))+"\n")
          PY

      - name: Reproduce rank-2 block and freeze seed 3
        working-directory: work
        run: |
          set -euo pipefail
          python ../rh-window15-krylov/certify_residual_block.py \
            --baseline ../sourcepkt/spectral \
            --parity "$PARITY" \
            --seed seed1.json --seed seed2.json \
            --c3 c3_1.json --c3 c3_2.json \
            --c4-gram c4_r2.json \
            --threshold 5.26e-97 \
            --precision 1024 \
            --tag "rank2_${PARITY}" \
            --next-seed seed3.json
          python - <<'PY'
          import json,os
          d=json.load(open(f"rank2_{os.environ['PARITY']}_receipt.json"))
          got=d["result"]["inertia"]
          expect={"even":{"positive":862,"negative":2,"zero":0},
                  "odd":{"positive":863,"negative":1,"zero":0}}[os.environ["PARITY"]]
          print("rank2 inertia",got)
          if got!=expect: raise SystemExit(f"rank2 regression mismatch: {got} != {expect}")
          if not __import__("pathlib").Path("seed3.json").exists(): raise SystemExit("seed3 not generated")
          print("PASS_RANK2_REGRESSION_AND_SEED3")
          PY

      - name: Build seed-3 certified moments and rank-3 C4 Gram
        working-directory: work
        run: |
          set -euo pipefail
          python ../rh-window15-krylov/build_increment_moments.py \
            --parity "$PARITY" \
            --seed seed1.json --seed seed2.json --seed seed3.json \
            --old-c4 c4_r2.json \
            --c3-out c3_3.json \
            --c4-out c4_r3.json \
            --stage all \
            --precision 8192

      - name: Certify rank 3 and freeze seed 4 only if needed
        working-directory: work
        run: |
          set -euo pipefail
          python ../rh-window15-krylov/certify_residual_block.py \
            --baseline ../sourcepkt/spectral \
            --parity "$PARITY" \
            --seed seed1.json --seed seed2.json --seed seed3.json \
            --c3 c3_1.json --c3 c3_2.json --c3 c3_3.json \
            --c4-gram c4_r3.json \
            --threshold 5.26e-97 \
            --precision 1024 \
            --tag "rank3_${PARITY}" \
            --next-seed seed4.json

      - name: Continue to rank 4 if rank 3 remains defective
        working-directory: work
        run: |
          set -euo pipefail
          if [ ! -f seed4.json ]; then
            echo "Rank 3 already meets the target for $PARITY; rank 4 not needed."
            exit 0
          fi
          python ../rh-window15-krylov/build_increment_moments.py \
            --parity "$PARITY" \
            --seed seed1.json --seed seed2.json --seed seed3.json --seed seed4.json \
            --old-c4 c4_r3.json \
            --c3-out c3_4.json \
            --c4-out c4_r4.json \
            --stage all \
            --precision 8192
          python ../rh-window15-krylov/certify_residual_block.py \
            --baseline ../sourcepkt/spectral \
            --parity "$PARITY" \
            --seed seed1.json --seed seed2.json --seed seed3.json --seed seed4.json \
            --c3 c3_1.json --c3 c3_2.json --c3 c3_3.json --c3 c3_4.json \
            --c4-gram c4_r4.json \
            --threshold 5.26e-97 \
            --precision 1024 \
            --tag "rank4_${PARITY}" \
            --next-seed seed5.json

      - name: Summarize adaptive result
        if: always()
        working-directory: work
        run: |
          python - <<'PY'
          import json,os,pathlib
          parity=os.environ["PARITY"]; target=1 if parity=="even" else 0
          rows=[]
          for r in [2,3,4]:
              p=pathlib.Path(f"rank{r}_{parity}_receipt.json")
              if p.exists():
                  d=json.load(open(p)); rows.append({"rank":r,"inertia":d["result"]["inertia"]})
          final=rows[-1] if rows else None
          closed=bool(final and final["inertia"]["negative"]==target)
          out={"parity":parity,"target_negative_count":target,"ranks":rows,
               "target_closed":closed,"next_seed_exists":pathlib.Path("seed5.json").exists()}
          print(json.dumps(out,indent=2))
          open("adaptive_summary.json","w").write(json.dumps(out,indent=2)+"\n")
          PY

      - name: Upload parity certificate packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window15-krylov-${{ matrix.parity }}
          retention-days: 30
          compression-level: 6
          path: |
            work/*receipt.json
            work/adaptive_summary.json
            work/seed3.json
            work/seed4.json
            work/seed5.json
            work/c3_3.json
            work/c3_4.json
            work/c4_r3.json
            work/c4_r4.json
            work/rank*_schur.json
            work/rank*_head_congruence.json
            work/rank*_residual_block*.json
