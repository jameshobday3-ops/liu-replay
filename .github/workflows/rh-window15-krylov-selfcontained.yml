name: RH Window15 Self-Contained Adaptive Krylov

on:
  push:
    branches:
      - rh-window15-krylov
    paths:
      - '.github/workflows/rh-window15-krylov-selfcontained.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: rh-window15-krylov-selfcontained
  cancel-in-progress: true

jobs:
  krylov:
    strategy:
      fail-fast: false
      matrix:
        parity: [even, odd]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PARITY: ${{ matrix.parity }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned arithmetic stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install python-flint==0.8.0 mpmath==1.3.0 numpy==2.3.5 scipy==1.17.0

      - name: Download frozen Window15 source packet
        uses: actions/download-artifact@v4
        with:
          name: window15-source-packet
          path: sourcepkt
          repository: ${{ github.repository }}
          run-id: 41896525565
          github-token: ${{ github.token }}

      - name: Generate and freeze seed 1 from zero-shift defect
        run: |
          set -euo pipefail
          mkdir -p work
          if [ "$PARITY" = even ]; then P=0; else P=1; fi
          echo "P=$P" >> "$GITHUB_ENV"
          cd sourcepkt/spectral
          python certify_spectrum.py --parity "$PARITY" --thresholds 0 --precision 1024
          cp "p${P}_s0_residual_polynomial_proposal.json" ../../work/seed1.json
          cd ../..
          sha256sum work/seed1.json

      - name: Build and certify rank 1
        run: |
          set -euo pipefail
          cd work
          python ../rh-window15-krylov/build_increment_moments.py \
            --parity "$PARITY" \
            --seed seed1.json \
            --c3-out c3_1.json \
            --c4-out c4_r1.json \
            --stage all \
            --precision 8192
          python ../rh-window15-krylov/certify_residual_block.py \
            --baseline ../sourcepkt/spectral \
            --parity "$PARITY" \
            --seed seed1.json \
            --c3 c3_1.json \
            --c4-gram c4_r1.json \
            --threshold 5.26e-97 \
            --precision 1024 \
            --tag "rank1_${PARITY}" \
            --next-seed seed2.json

      - name: Build and certify rank 2 if needed
        run: |
          set -euo pipefail
          cd work
          if [ ! -f seed2.json ]; then
            echo "Rank 1 already closes $PARITY."
            exit 0
          fi
          python ../rh-window15-krylov/build_increment_moments.py \
            --parity "$PARITY" \
            --seed seed1.json --seed seed2.json \
            --old-c4 c4_r1.json \
            --c3-out c3_2.json \
            --c4-out c4_r2.json \
            --stage all \
            --precision 8192
          python ../rh-window15-krylov/certify_residual_block.py \
            --baseline ../sourcepkt/spectral \
            --parity "$PARITY" \
            --seed seed1.json --seed seed2.json \
            --c3 c3_1.json --c3 c3_2.json \
            --c4-gram c4_r2.json \
            --threshold 5.26e-97 \
            --precision 1024 \
            --tag "rank2_${PARITY}" \
            --next-seed seed3.json

      - name: Build and certify rank 3 if needed
        run: |
          set -euo pipefail
          cd work
          if [ ! -f seed3.json ]; then
            echo "Rank 2 already closes $PARITY."
            exit 0
          fi
          python ../rh-window15-krylov/build_increment_moments.py \
            --parity "$PARITY" \
            --seed seed1.json --seed seed2.json --seed seed3.json \
            --old-c4 c4_r2.json \
            --c3-out c3_3.json \
            --c4-out c4_r3.json \
            --stage all \
            --precision 8192
          python ../rh-window15-krylov/certify_residual_block.py \
            --baseline ../sourcepkt/spectral \
            --parity "$PARITY" \
            --seed seed1.json --seed seed2.json --seed seed3.json \
            --c3 c3_1.json --c3 c3_2.json --c3 c3_3.json \
            --c4-gram c4_r3.json \
            --threshold 5.26e-97 \
            --precision 1024 \
            --tag "rank3_${PARITY}" \
            --next-seed seed4.json

      - name: Build and certify rank 4 if needed
        run: |
          set -euo pipefail
          cd work
          if [ ! -f seed4.json ]; then
            echo "Rank 3 already closes $PARITY."
            exit 0
          fi
          python ../rh-window15-krylov/build_increment_moments.py \
            --parity "$PARITY" \
            --seed seed1.json --seed seed2.json --seed seed3.json --seed seed4.json \
            --old-c4 c4_r3.json \
            --c3-out c3_4.json \
            --c4-out c4_r4.json \
            --stage all \
            --precision 8192
          python ../rh-window15-krylov/certify_residual_block.py \
            --baseline ../sourcepkt/spectral \
            --parity "$PARITY" \
            --seed seed1.json --seed seed2.json --seed seed3.json --seed seed4.json \
            --c3 c3_1.json --c3 c3_2.json --c3 c3_3.json --c3 c3_4.json \
            --c4-gram c4_r4.json \
            --threshold 5.26e-97 \
            --precision 1024 \
            --tag "rank4_${PARITY}" \
            --next-seed seed5.json

      - name: Summarize adaptive hierarchy
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          parity=os.environ["PARITY"]; target=1 if parity=="even" else 0
          rows=[]
          for r in range(1,5):
              p=pathlib.Path("work")/f"rank{r}_{parity}_receipt.json"
              if p.exists():
                  d=json.load(open(p))
                  rows.append({
                      "rank":r,
                      "inertia":d["result"]["inertia"],
                      "residual_block":d["result"]["residual_block_certificate"]
                  })
          final=rows[-1] if rows else None
          closed=bool(final and final["inertia"]["negative"]==target)
          out={
              "status":"ADAPTIVE_KRYLOV_COMPLETE",
              "parity":parity,
              "physical_threshold":"5.26e-97",
              "target_negative_count":target,
              "ranks":rows,
              "target_closed":closed,
              "next_seed_exists":(pathlib.Path("work")/"seed5.json").exists()
          }
          print(json.dumps(out,indent=2))
          (pathlib.Path("work")/"adaptive_summary.json").write_text(json.dumps(out,indent=2)+"\n")
          PY

      - name: Upload certificate packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window15-selfcontained-krylov-${{ matrix.parity }}
          retention-days: 30
          compression-level: 6
          path: |
            work/*.json
