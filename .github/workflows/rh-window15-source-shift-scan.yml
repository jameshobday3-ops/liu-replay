name: RH Window15 Source-Shift Gap Scan

on:
  push:
    branches:
      - rh-window15-enrichment-audit
    paths:
      - '.github/workflows/rh-window15-source-shift-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rh-window15-source-shift-gap-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned arithmetic stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install python-flint==0.8.0 mpmath==1.3.0 numpy==2.3.5 scipy==1.17.0
      - name: Rebuild adaptive source
        working-directory: rh-window15-audit/spectral
        run: |
          python adaptive_source.py --L 3/2 --cells 16384 --iterations 600
          mkdir -p inputs
          cp source_weights_L3_2.json inputs/source_weights_L3_2.json
      - name: Rebuild moments and budgets
        working-directory: rh-window15-audit/spectral
        run: |
          python build_moments.py
          python budget.py
      - name: Rebuild 864-mode sources
        working-directory: rh-window15-audit/spectral
        run: python build_sources.py
      - name: Certified even source-shift threshold scan
        working-directory: rh-window15-audit/spectral
        run: python source_shift_scan.py --parity even --precision 1024
      - name: Upload scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window15-source-shift-gap-scan
          retention-days: 30
          path: |
            rh-window15-audit/spectral/even_source_shift_scan_receipt.json
            rh-window15-audit/spectral/sourceshift_scan_*_schur.json
            rh-window15-audit/spectral/sourceshift_scan_*_head_congruence.json
