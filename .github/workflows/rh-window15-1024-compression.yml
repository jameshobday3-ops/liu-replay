name: RH Window15 1024-Mode Compression Pilot

on:
  push:
    branches:
      - rh-window15-enrichment-audit
    paths:
      - '.github/workflows/rh-window15-1024-compression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rh-window15-1024-compression
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned arithmetic stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install python-flint==0.8.0 mpmath==1.3.0 numpy==2.3.5 scipy==1.17.0
      - name: Rebuild adaptive source
        working-directory: rh-window15-audit/spectral
        run: |
          set -euo pipefail
          python adaptive_source.py --L 3/2 --cells 16384 --iterations 600
          mkdir -p inputs
          cp source_weights_L3_2.json inputs/source_weights_L3_2.json
      - name: Rebuild certified moment packet
        working-directory: rh-window15-audit/spectral
        run: python build_moments.py
      - name: Rebuild baseline continuum budget
        working-directory: rh-window15-audit/spectral
        run: python budget.py
      - name: Build 1024-mode-per-parity interval sources
        working-directory: rh-window15-audit/spectral
        run: python build_sources_param.py --parity-modes 1024 --precision 8192
      - name: Rebuild physical even trial
        working-directory: rh-window15-audit/spectral
        run: python physical_even_trial.py
      - name: Certify 1024-mode even target
        working-directory: rh-window15-audit/spectral
        run: python certify_spectrum_param.py --parity even --thresholds 5.26e-97 --precision 1024
      - name: Certify 1024-mode odd target
        working-directory: rh-window15-audit/spectral
        run: python certify_spectrum_param.py --parity odd --thresholds 5.26e-97 --precision 1024
      - name: Evaluate simple-even target
        working-directory: rh-window15-audit/spectral
        run: |
          python - <<'PY'
          import json
          e=json.load(open('even_spectral_receipt.json'))['results'][-1]['inertia']
          o=json.load(open('odd_spectral_receipt.json'))['results'][-1]['inertia']
          print('EVEN',e)
          print('ODD',o)
          if e=={'positive':1023,'negative':1,'zero':0} and o=={'positive':1024,'negative':0,'zero':0}:
              print('PASS_1024_SIMPLE_EVEN_TARGET')
          else:
              print('NO_CLOSE_AT_1024')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window15-1024-compression-pilot
          retention-days: 30
          path: |
            rh-window15-audit/spectral/*spectral_receipt.json
            rh-window15-audit/spectral/*s5p26em97_head_congruence.json
            rh-window15-audit/spectral/*s5p26em97_schur.json
            rh-window15-audit/spectral/even_trial_receipt.json
            rh-window15-audit/spectral/source_build_receipt.json
            rh-window15-audit/spectral/budget_receipt.json

# loader-fix-rerun
