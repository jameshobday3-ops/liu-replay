name: Export Window15 Source Matrices

on:
  push:
    branches:
      - rh-window15-krylov
    paths:
      - '.github/workflows/export-window15-source.yml'

permissions:
  contents: read

concurrency:
  group: export-window15-source
  cancel-in-progress: true

jobs:
  build-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned arithmetic stack
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install python-flint==0.8.0 mpmath==1.3.0 numpy==2.3.5 scipy==1.17.0

      - name: Rebuild adaptive source
        working-directory: rh-window15-audit/spectral
        run: |
          set -euo pipefail
          python adaptive_source.py --L 3/2 --cells 16384 --iterations 600
          mkdir -p inputs
          cp source_weights_L3_2.json inputs/source_weights_L3_2.json

      - name: Rebuild moments
        working-directory: rh-window15-audit/spectral
        run: python build_moments.py

      - name: Rebuild budgets
        working-directory: rh-window15-audit/spectral
        run: python budget.py

      - name: Rebuild all six source matrices
        working-directory: rh-window15-audit/spectral
        run: python build_sources.py

      - name: Cross-check source entries
        working-directory: rh-window15-audit/spectral
        run: python check_low_sources.py

      - name: Collect local-prototyping packet
        run: |
          set -euo pipefail
          mkdir -p window15-source-packet/spectral
          cp rh-window15-audit/spectral/A0.jsonl.gz window15-source-packet/spectral/
          cp rh-window15-audit/spectral/A1.jsonl.gz window15-source-packet/spectral/
          cp rh-window15-audit/spectral/B0.jsonl.gz window15-source-packet/spectral/
          cp rh-window15-audit/spectral/B1.jsonl.gz window15-source-packet/spectral/
          cp rh-window15-audit/spectral/K0.jsonl.gz window15-source-packet/spectral/
          cp rh-window15-audit/spectral/K1.jsonl.gz window15-source-packet/spectral/
          cp rh-window15-audit/spectral/source_build_receipt.json window15-source-packet/spectral/
          cp rh-window15-audit/spectral/source_receipt_L3_2.json window15-source-packet/spectral/
          cp rh-window15-audit/spectral/budget_receipt.json window15-source-packet/spectral/
          cp rh-window15-audit/spectral/low_source_crosscheck.json window15-source-packet/spectral/
          cp rh-window15-audit/spectral/certify_spectrum.py window15-source-packet/spectral/
          cp rh-window15-audit/spectral/build_sources.py window15-source-packet/spectral/
          cp rh-window15-audit/spectral/build_moments.py window15-source-packet/spectral/
          cp rh-window15-audit/spectral/adaptive_source.py window15-source-packet/spectral/
          cp rh-window15-audit/spectral/budget.py window15-source-packet/spectral/
          sha256sum window15-source-packet/spectral/* > window15-source-packet/SHA256SUMS.txt

      - name: Upload source packet
        uses: actions/upload-artifact@v4
        with:
          name: window15-source-packet
          retention-days: 7
          compression-level: 1
          path: window15-source-packet/
